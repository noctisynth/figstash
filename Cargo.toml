[workspace]
members = [
    "crates/figstash-cli",
    "crates/figstash-core",
    "crates/figstash-figma",
    "crates/figstash-query",
    "crates/figstash-store",
]
default-members = ["crates/figstash-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
repository = "https://github.com/noctisynth/figstash"
readme = "README.md"
keywords = ["figma", "cli", "agents", "design", "offline"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
figstash-core = { version = "0.1.0-alpha.0", path = "crates/figstash-core" }
figstash-figma = { version = "0.1.0-alpha.0", path = "crates/figstash-figma" }
figstash-query = { version = "0.1.0-alpha.0", path = "crates/figstash-query" }
figstash-store = { version = "0.1.0-alpha.0", path = "crates/figstash-store" }
insta = { version = "1.48.0", default-features = false, features = ["json", "redactions"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
