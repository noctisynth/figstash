[package]
name = "figstash-cli"
description = "Agent-facing command-line interface for Figstash"
version = "0.1.0-alpha.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "figstash"
path = "src/main.rs"

[dependencies]
blake3 = "1.8.6"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
figstash-core.workspace = true
figstash-figma.workspace = true
figstash-query.workspace = true
figstash-store.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "time"] }
toml = "1.1.4"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.1", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
async-trait = "0.1.92"
jsonschema = "0.49.9"
tempfile = "3.27.0"
url = "2.5.8"
