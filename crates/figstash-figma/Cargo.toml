[package]
name = "figstash-figma"
description = "Figma REST boundary for Figstash"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1.92"
blake3 = "1.8.6"
chrono = "0.4.45"
figstash-core.workspace = true
futures-util = "0.3.34"
keyring = { version = "3.6.3", features = ["apple-native", "linux-native", "windows-native"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "json", "system-proxy"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }
url = "2.5.8"

[lints]
workspace = true
