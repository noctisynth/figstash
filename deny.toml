[graph]
all-features = true
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]

[advisories]
# Historical arrayref releases were yanked after a 2026 registry incident.
# The lockfile pins a pre-incident release; actual RustSec advisories remain denied.
yanked = "warn"

[licenses]
confidence-threshold = 0.8
private = { ignore = true }
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [
  { allow = ["AGPL-3.0-only"], crate = "figstash-cli" },
  { allow = ["AGPL-3.0-only"], crate = "figstash-core" },
  { allow = ["AGPL-3.0-only"], crate = "figstash-figma" },
  { allow = ["AGPL-3.0-only"], crate = "figstash-query" },
  { allow = ["AGPL-3.0-only"], crate = "figstash-store" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
